[pytest]
# Default collection must not silently omit important suites.
#
# Every dated run under tests/runs/ keeps its own suite/conftest.py with
# run-specific helpers, and test modules import them via `from conftest
# import ...`. Because each suite directory is named "suite", a single
# top-level `conftest` module used to shadow the others when more than one
# suite was collected, so the default config deliberately listed only two
# suites and silently dropped the rest. backend/conftest.py now re-resolves
# `conftest` per suite (see the hook there), so all validated suites can be
# collected together.
#
# Included (validated regression/audit suites):
#   - 2026-05-02_physics-accuracy       : full BB84 physics accuracy
#   - 2026-05-04_comprehensive-validation : 8-section empirical validation
#   - 2026-09-09_event-model-transmission : event-model accounting
#   - 2026-09-14_p1-audit-fixes         : audit fixes H1-H7
#   - 2026-09-14_qber-small-sample      : audit fix C1
# Excluded on purpose (one-off sweep/investigation scripts, not suites):
#   2026-06-08_channel-vacuum-bug, 2026-06-12_table-iv-wcp-mu-sweep,
#   2026-06-18_table-iii-distance-sweep, 2026-06-22_table-vii-decoy-verification,
#   2026-06-24_table-ix-detector-efficiency-sweep
# Run one directly with: pytest tests/runs/<run>/suite
testpaths =
    tests/runs/2026-05-02_physics-accuracy/suite
    tests/runs/2026-05-04_comprehensive-validation/suite
    tests/runs/2026-09-09_event-model-transmission/suite
    tests/runs/2026-09-14_p1-audit-fixes/suite
    tests/runs/2026-09-14_qber-small-sample/suite
markers =
    slow: Full precision sweep (n_bits=5000, 5 trials). Run with: pytest -m slow
    fast: Quick sanity checks (n_bits=1000, 3 trials). Run with: pytest -m fast
    sync: Frontend/backend API sync tests. Requires backend running. Run with: pytest -m sync
asyncio_mode = strict
